<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Reporte por nombre</title>
</head>
<body>
<h1>Reporte: Buscar usuario por nombre</h1>
<form method="get" th:action="@{/usuarios/reporte-nombre}">
  Nombre contiene: <input type="text" name="nombre"/>
  <button type="submit">Buscar</button>
</form>
<table border="1" cellpadding="5">
  <tr>
    <th>Nombre</th><th>Rol</th>
  </tr>
  <tr th:each="usuario : ${usuarios}">
    <td th:text="${usuario.nombre}"></td>
    <td th:text="${usuario.rol}"></td>
  </tr>
</table>
<a th:href="@{/usuarios}">Volver</a>
</body>
</html>
